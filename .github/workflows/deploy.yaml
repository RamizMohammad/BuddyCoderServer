name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh root@${{ secrets.VPS_IP }} \
            "tmux send-keys -t budduyServer C-c Enter && \
            sleep 2 && \
            tmux send-keys -t budduyServer 'cd /root/Projects/BuddyCoderServer && git fetch origin main && git reset --hard origin/main' Enter && \
            sleep 3 && \
            tmux send-keys -t budduyServer 'source /root/miniconda3/etc/profile.d/conda.sh && conda activate py310 && pip install -r requirements.txt' Enter && \
            sleep 5 && \
            tmux send-keys -t budduyServer 'uvicorn server:app --host 0.0.0.0 --port 443' Enter"