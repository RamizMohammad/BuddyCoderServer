name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh root@${{ secrets.VPS_IP }} \
            "cd /root/BuddyCoderServer/backend && \
            git pull origin main && \
            source /root/miniconda3/etc/profile.d/conda.sh && \
            conda activate py310 && \
            pip install -r requirements.txt && \
            tmux send-keys -t budduyServer C-c && \
            sleep 2 && \
            tmux send-keys -t budduyServer 'source /root/miniconda3/etc/profile.d/conda.sh && conda activate py310 && python server.py' C-m"